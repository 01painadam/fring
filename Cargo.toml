[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/01painadam/fring"

# Internal crates. Each crate refers to these with `<name>.workspace = true`.
[workspace.dependencies]
fring-model = { path = "crates/fring-model" }
fring-cpu = { path = "crates/fring-cpu" }
fring-gpu = { path = "crates/fring-gpu" }
fring-collide = { path = "crates/fring-collide" }
fring-io = { path = "crates/fring-io" }
fring-analysis = { path = "crates/fring-analysis" }

# External crates. Add a crate here only after A0 agrees (ask AJ if the
# dependency is large or hard to remove).
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"
rayon = "1.11"
# GPU (fring-gpu only, approved by A0 for task G1, 2026-11-01).
wgpu = "30.0.1"
pollster = "1.0.1"
# Web app (fring-web only, wasm32 target only, approved by AJ for task W1, 2026-11-02).
# wasm-bindgen-cli must have exactly the same version as wasm-bindgen.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = "=0.3.107"
console_error_panic_hook = "=0.1.7"

# Lints for every crate (each crate has `[lints] workspace = true`).
# A crate that needs `unsafe` must allow it locally and link an ADR.
[workspace.lints.rust]
unsafe_code = "deny"

# Size-tuned release profile for the wasm build; only apps/fring-web/scripts/build.sh uses it.
# The normal `release` profile (native speed of fring-run, fring-gpu, fring-bench) is not changed.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
