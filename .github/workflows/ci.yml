name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: fring-model, fring-io, fring-gpu and fring-web build for wasm32
        run: cargo check -p fring-model -p fring-io -p fring-gpu -p fring-web --target wasm32-unknown-unknown

      # web.rs is compiled only for wasm32, so the host clippy step does not see it.
      - name: fring-web clippy for wasm32
        run: cargo clippy -p fring-web --target wasm32-unknown-unknown -- -D warnings

      # wasm-bindgen-cli must equal the wasm-bindgen crate version (Cargo.toml).
      # rust-cache keeps ~/.cargo/bin, so the install runs only on a cold cache.
      - name: fring-web web build and wasm size limit (2 MiB)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          apps/fring-web/scripts/build.sh
          size=$(wc -c < apps/fring-web/dist/fring_web_bg.wasm)
          echo "fring_web_bg.wasm: $size bytes (limit 2097152)"
          test "$size" -gt 0 && test "$size" -lt 2097152
