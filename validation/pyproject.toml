[project]
name = "fring-validation"
version = "0.1.0"
description = "REBOUND reference runs for the fring Rust code (role A6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rebound==5.2.2",
    "reboundx==5.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fring_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
