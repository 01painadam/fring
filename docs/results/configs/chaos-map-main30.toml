# A1-ANALYSIS chaos map (main30). Narrower band than main10: the 30-year run with 139,700 to 141,100 km stopped at 'unbound or invalid orbit' (a particle scattered by Prometheus; no sub-stepping yet). ADR 0008 settings. Band limits: see docs/results/a1-analysis.md.
[run]
name = "chaos-map-main30"
backend = "gpu"
seed = 20261102
params_dir = "params"

[time]
step_s = 356.2537
duration_years = 30.0

[frame]
reference_semi_major_axis_km = 140222.43

[domain]
kind = "full_ring"

[moons]
include = ["prometheus", "pandora"]

[particles]
count = 110000

[particles.distribution]
kind = "band"
min_semi_major_axis_km = 139950.0
