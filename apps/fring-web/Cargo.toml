[package]
name = "fring-web"
description = "WebAssembly app: replay viewer and live test-particle toy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# cdylib: the .wasm file. rlib: lets the host run the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
fring-model.workspace = true

# Only the wasm32 build needs these. The host build (clippy, tests) compiles none of them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fring-gpu.workspace = true
wgpu.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlButtonElement", "Event", "MouseEvent", "WheelEvent", "PointerEvent", "EventTarget", "CssStyleDeclaration", "Navigator", "Gpu", "DomRect", "AddEventListenerOptions", "console"] }
console_error_panic_hook.workspace = true

# Native GPU test of shaders/project.wgsl (ignored by default; needs a GPU).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fring-gpu.workspace = true
wgpu.workspace = true
pollster.workspace = true

[lints]
workspace = true
